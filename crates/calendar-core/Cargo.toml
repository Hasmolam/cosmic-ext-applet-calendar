[package]
name = "calendar-core"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
calendar-client = { path = "../calendar-client" }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
regex = "1.13"
rrule = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
